name: Version tag

# Toda correcao que chega a main (merge de PR) ganha uma tag de versao.
# A release no GitHub e criada por release.yml quando a tag e enviada.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  tag:
    name: Criar proxima tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com historico e tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calcular e enviar tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git fetch --tags --force origin
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"

          if [[ -z "$latest" ]]; then
            # Primeira versao: representa a entrada em producao.
            next="v1.0.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"

            # PR com label 'major'/'minor' controla o incremento; senao e patch.
            labels="$(gh api "repos/$GH_REPO/commits/$SHA/pulls" \
              --jq '.[0].labels[].name' 2>/dev/null || true)"

            if grep -qi '^major$' <<< "$labels"; then
              major=$((major + 1)); minor=0; patch=0
            elif grep -qi '^minor$' <<< "$labels"; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="v${major}.${minor}.${patch}"
          fi

          # Se duas merges chegarem juntas, nao tentar re-criar uma tag existente.
          while git rev-parse -q --verify "refs/tags/$next" >/dev/null; do
            IFS='.' read -r major minor patch <<< "${next#v}"
            patch=$((patch + 1))
            next="v${major}.${minor}.${patch}"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "Release $next"
          git push origin "refs/tags/$next"

          echo "Tag criada: $next"
