# Override para desenvolvimento: adiciona phpMyAdmin.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# NAO utilizar em producao.
services:
  app:
    environment:
      # Chave de criptografia MFA de desenvolvimento (NAO usar em producao)
      VISITORPASS_MFA_KEY: ${VISITORPASS_MFA_KEY:-3f2e6a1c9b8d4f0a5c7e9b2d4f6a8c0d1e3f5a7b9c1d3e5f7a9b1c3d5e7f9a1b}
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: visitantes-pma
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 50M
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - frontend
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 256m
    pids_limit: 128